# GitHub Actions Workflow is created for testing and preparing the plugin release in the following steps:
# - Run the 'buildPlugin' task and prepare artifact for further tests.
# - Run the 'check' task (the test suite) and the 'verifyPlugin' task (IntelliJ Plugin Verifier against
#   the IDE builds listed in build.gradle.kts; the Community targets are what catch an Ultimate-only API
#   reference, since the unified 262 artifact cannot exclude it).
# - Create a draft release, gated on both.
#
# The workflow is triggered on push and pull_request events, and can be dispatched manually.
# The Gradle Wrapper is validated by gradle/actions/setup-gradle, where `validate-wrappers` defaults to true.
#
# GitHub Actions reference: https://help.github.com/en/actions
#
## JBIJPPTPL

name: Build
on:
  # Trigger the workflow on pushes to only the 'main' branch (this avoids duplicate checks being run e.g., for dependabot pull requests)
  push:
    branches: [ main ]
  # Trigger the workflow on any pull request
  pull_request:
  # Allow a manual run, e.g. to re-create a release draft after a transient failure
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # Prepare environment and build the plugin
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.properties.outputs.version }}
      changelog: ${{ steps.properties.outputs.changelog }}
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      # v6 defaults to the proprietary 'enhanced' cache provider; 'basic' is the plain actions/cache
      # implementation used before, so cache data is not sent to a third-party service.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Set environment variables
      - name: Export Properties
        id: properties
        shell: bash
        run: |
          PROPERTIES="$(./gradlew properties --console=plain -q)"
          # first three segments: gradle.properties carries a fourth development segment (SNAPSHOT),
          # the release draft is tagged without it and release.yml publishes under the tag
          VERSION="$(echo "$PROPERTIES" | grep "^version:" | cut -f2- -d ' ' | cut -d '.' -f1-3)"
          CHANGELOG="$(./gradlew getChangelog --unreleased --no-header --console=plain -q)"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # Build plugin
      - name: Build plugin
        run: ./gradlew buildPlugin

      # Store the distribution zip as an artifact for downloading and manual installation
      - name: Prepare Plugin Artifact
        id: artifact
        shell: bash
        run: |
          mapfile -t ZIPS < <(ls build/distributions/*.zip)
          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one plugin zip in build/distributions, found ${#ZIPS[@]}"
            exit 1
          fi
          FILENAME="$(basename "${ZIPS[0]}")"
          echo "filename=${FILENAME%.zip}" >> "$GITHUB_OUTPUT"

      # Store already-built plugin as an artifact for downloading
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: build/distributions/*.zip

  # Run the test suite against the target platform
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Run tests
      - name: Run Tests
        run: ./gradlew check

      # Collect Tests Result of failed tests
      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-result
          path: ${{ github.workspace }}/build/reports/tests
          if-no-files-found: ignore

  # Run plugin structure verification along with IntelliJ Plugin Verifier
  verify:
    name: Verify plugin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:

      # Free GitHub Actions Environment Disk Space
      # Pinned to v2.0.0: this is a third-party action, so the ref must not be a moving branch.
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Run Verify Plugin task and IntelliJ Plugin Verifier tool.
      # The IDE builds resolve as Gradle dependencies into the Gradle cache, which
      # gradle/actions/setup-gradle above already persists; no separate IDE cache here.
      - name: Run Plugin Verification tasks
        run: ./gradlew verifyPlugin

      # Collect Plugin Verifier Result
      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier

  # Prepare a draft release for GitHub Releases page for the manual verification
  # If accepted and published, release workflow would be triggered
  releaseDraft:
    name: Release draft
    if: github.event_name != 'pull_request'
    needs: [ build, test, verify ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Skip a version that is already published: gradle.properties keeps the previous version until
      # the next manual bump, so this is the normal state of main between releases and must stay green.
      # A tag without any release is different: a draft created for it would silently target that older
      # commit, so fail and ask for a version bump instead. An existing draft is simply recreated below.
      - name: Check Version Availability
        id: availability
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          DRAFT="$(gh api "repos/{owner}/{repo}/releases/tags/$VERSION" --jq '.draft' 2>/dev/null || true)"
          if [ "$DRAFT" = "false" ]; then
            echo "::notice::Release $VERSION is already published, skipping the release draft"
            SKIP=true
          elif [ -z "$DRAFT" ] && gh api "repos/{owner}/{repo}/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION exists but has no release; a draft would be created against that older commit. Bump pluginVersion in gradle.properties."
            exit 1
          else
            SKIP=false
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      # Remove old release drafts by using the curl request for the available releases with a draft flag
      - name: Remove Old Release Drafts
        if: ${{ steps.availability.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/{owner}/{repo}/releases --paginate \
            --jq '.[] | select(.draft == true) | .id' \
            | while read -r id; do
                gh api -X DELETE "repos/{owner}/{repo}/releases/$id"
              done

      # Create a new release draft which is not publicly visible and requires manual acceptance.
      # The notes go through a file, so their content is never interpolated into the shell script.
      - name: Create Release Draft
        if: ${{ steps.availability.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANGELOG: ${{ needs.build.outputs.changelog }}
        run: |
          printf '%s\n' "$CHANGELOG" > release-notes.md
          gh release create "$VERSION" \
            --draft \
            --title "$VERSION" \
            --notes-file release-notes.md
