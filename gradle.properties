# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html
pluginGroup=ru.alezhu.idea.plugins
pluginName=Kotlin Named Argument Stubs
pluginRepositoryUrl=https://github.com/alezhu/intellij_named_argument_stubs_plugin
# SemVer format -> https://semver.org
pluginVersion=1.0.8.SNAPSHOT
# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# No pluginUntilBuild on purpose: without an until-build the plugin keeps installing into newer IDEs,
# and the verifyPlugin matrix in build.gradle.kts is the gate that says a new line is actually OK.
pluginSinceBuild=233
# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-gradle-intellij-plugin.html#configuration-intellij-extension
# One IDEA distribution since 253; see `intellijIdea(...)` in build.gradle.kts.
platformVersion=2026.2.4
# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
# Example: platformPlugins = com.jetbrains.php:203.4449.22, org.intellij.scala:2023.3.27@EAP
platformPlugins=
# Example: platformBundledPlugins = com.intellij.java
platformBundledPlugins=com.intellij.java, org.jetbrains.kotlin
# Tests boot the platform with these bundled plugins enabled; without them the Kotlin plugin
# is loaded but disabled, so .kt files are parsed as plain text (262 split Kotlin/Java into content
# modules that need Structure View, Test Runner, TODO and friends to resolve).
# com.intellij.java and org.jetbrains.kotlin are deliberately absent: plugin.xml <depends> enables them.
# Bisected entry by entry on 2026.2.4 with ./gradlew test --rerun --no-build-cache; dropping any one of
# these five fails 25 of 34 tests. build.gradle.kts declares this list as an input of :test and
# :prepareTest, so a change invalidates their cached result instead of replaying a pass for a list
# that was never booted.
platformTestBundledPlugins=intellij.libraries.misc.plugin, intellij.structureView.plugin, intellij.testRunner.plugin, intellij.todo.plugin, intellij.structuralSearch.plugin
# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion=9.5.1
# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false
# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true